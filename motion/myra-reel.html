<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Myra — Reel</title>
<style>
  @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 200 500; src: url(fonts/newsreader.woff2) format("woff2"); }
  @font-face { font-family: "Newsreader"; font-style: italic; font-weight: 200 500; src: url(fonts/newsreader-italic.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 300 500; src: url(fonts/inter.woff2) format("woff2"); }

  :root {
    --cream: #f7f5f0;
    --butter: #f2e6b5;
    --terracotta: #ebcfbe;
    --ink: #1a1a1a;
    --divider: #d4d0c8;
  }
  html, body { margin: 0; height: 100%; background: #0f0e0d; overflow: hidden; }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px; overflow: hidden;
    background: var(--cream); color: var(--ink);
    transform-origin: 0 0;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity, filter; }
  .serif { font-family: "Newsreader", Georgia, serif; }
  .caps { text-transform: uppercase; letter-spacing: 0.24em; font-size: 13px; font-weight: 400; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.1em 0.16em; margin: -0.04em -0.1em -0.16em; }
  .mask > span { display: inline-block; will-change: transform; }
  .nowrap { white-space: nowrap; }
  canvas.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  img.cover { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 55%; }
  .card {
    overflow: hidden; border-radius: 18px; background: #eee;
    box-shadow: 0 1px 2px rgba(80, 50, 40, 0.06), 0 24px 60px -12px rgba(110, 70, 60, 0.22);
  }
  .glass {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 28px;
    box-shadow: 0 1px 2px rgba(80, 50, 40, 0.04), 0 40px 90px -30px rgba(120, 80, 70, 0.25);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; white-space: nowrap;
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="mbRow" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur id="mbRowG" stdDeviation="0 0" /></filter>
      <filter id="mbProd" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur id="mbProdG" stdDeviation="0 0" /></filter>
    </defs>
  </svg>
  <div id="stage"></div>
  <script src="reel.js"></script>
</body>
</html>
